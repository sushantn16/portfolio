name: Build

# Cloudflare Workers Builds deploys main. This workflow only checks that every
# push and pull request type-checks and builds.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Type-checks with astro check, then builds.
      - run: npm run build
